name: Paper trading bot

# Stocks: runs are scheduled hourly around US market hours on weekdays (13:00-20:00 UTC
# covers 9:30-16:00 New York in both summer and winter time). A run exits right away if
# the market isn't opening within the hour, and exits after the close. GitHub jobs max
# out at 6 hours, so a queued run takes over when the active one stops.
on:
  schedule:
    - cron: "7 13-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: timeout --signal=INT 345m python -m tradebot.live || [ $? -eq 124 ]
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
