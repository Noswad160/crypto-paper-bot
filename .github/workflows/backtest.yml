name: Backtest

# Run from the Actions tab: Backtest -> Run workflow. Results appear on the run's summary page.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of history"
        default: "90"
      symbols:
        description: "Symbols (comma-separated)"
        default: "SPY,QQQ,AAPL,MSFT,NVDA,TSLA"
      asset_class:
        description: "stocks or crypto"
        default: "stocks"

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DAYS: ${{ inputs.days }}
          SYMBOLS: ${{ inputs.symbols }}
          ASSET_CLASS: ${{ inputs.asset_class }}
        run: |
          python -m tradebot.backtest --sweep --days "$DAYS" --symbols "$SYMBOLS" --markdown results.md --text results.txt
          cat results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Send alert
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OK: ${{ job.status == 'success' }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          if [ "$OK" = "true" ] && [ -s results.txt ]; then
            curl -s -H "Title: Backtest results" -H "Tags: bar_chart" -H "Click: $RUN_URL" --data-binary @results.txt "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          else
            curl -s -H "Title: Backtest failed" -H "Tags: warning" -H "Click: $RUN_URL" -d "Tap to see what went wrong" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
